[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-tool-adapters"
dynamic = ["version"]
description = "MCP and UTCP ToolBox plugins for the OVOS agentic loop"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "OpenVoiceOS", email = "jarbasai@mailfence.com" }]
keywords = ["ovos", "mycroft", "mcp", "utcp", "agent", "toolbox", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "ovos-plugin-manager>=2.11.1a1,<3.0.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage     = "https://github.com/OpenVoiceOS/ovos-tool-adapters"
Repository   = "https://github.com/OpenVoiceOS/ovos-tool-adapters"
"Bug Tracker" = "https://github.com/OpenVoiceOS/ovos-tool-adapters/issues"

[project.optional-dependencies]
mcp  = ["mcp>=1.0"]
utcp = ["utcp>=1.1"]
dev  = ["pytest>=7.0", "pytest-cov", "pytest-asyncio"]
# CI installs the `test` extra. Without the adapters' own SDKs here the
# live round-trip tests (test/test_mcp_live.py, the utcp equivalents)
# importorskip themselves away, so the very thing this package exists to
# do is never exercised in CI -- it only looked green.
test = ["pytest>=7.0", "pytest-cov", "pytest-asyncio", "mcp>=1.0", "utcp>=1.1"]

[project.entry-points."opm.agents.toolbox"]
ovos-mcp-toolbox  = "ovos_tool_adapters.mcp:MCPToolBox"
ovos-utcp-toolbox = "ovos_tool_adapters.utcp:UTCPToolBox"

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_tool_adapters*"]

[tool.setuptools.dynamic]
version = { attr = "ovos_tool_adapters.version.__version__" }
